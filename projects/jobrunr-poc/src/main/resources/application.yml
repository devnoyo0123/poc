spring:
  application:
    name: jobrunr-poc

  datasource:
    url: jdbc:h2:mem:jobrunr
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

org:
  jobrunr:
    background-job-server:
      enabled: true
    dashboard:
      enabled: true
      username: admin
      password: admin
