spring:
  application:
    name: jobrunr-debounce-poc
  datasource:
    url: jdbc:postgresql://localhost:15432/jobrunr
    username: jobrunr
    password: jobrunr
    driver-class-name: org.postgresql.Driver

org:
  jobrunr:
    background-job-server:
      enabled: true
      worker-count: 2
    dashboard:
      enabled: true
    jobs:
      default-retries: 1

debounce:
  delay-seconds: 10