worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream ws_backend {
        # 단순 라운드 로빈 (sticky session 없음)
        # Redis Pub/Sub이 모든 ws-gateway 인스턴스에 메시지를 브로드캐스트하므로
        # 같은 클라이언트가 매번 같은 서버로 갈 필요가 없다.
        server ws-gateway-1:8081;
        server ws-gateway-2:8081;
    }

    upstream api_backend {
        server api-server:8080;
    }

    server {
        listen 80;
        server_name _;

        # WebSocket 엔드포인트
        location /ws/ {
            proxy_pass http://ws_backend;
            proxy_http_version 1.1;

            # WebSocket upgrade 필수 헤더
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WS 연결은 장시간 유지되므로 타임아웃 충분히
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # REST API 엔드포인트
        location /api/ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 헬스체크
        location /nginx-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
