spring:
  profiles:
    active: local

  datasource:
    url: jdbc:postgresql://localhost:5432/tdd_lab
    username: tdd_lab
    password: tdd_lab
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
