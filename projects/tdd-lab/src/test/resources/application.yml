spring:
  profiles:
    active: test

  datasource:
    url: jdbc:h2:mem:tdd_lab_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

  flyway:
    enabled: false

logging:
  level:
    org.hibernate.SQL: debug
